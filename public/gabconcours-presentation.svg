<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">GABConcours accompagne votre candidature</title><desc id="desc">Un candidat consulte son espace GabConcours et suit sa candidature.</desc><defs><clipPath id="portrait"><rect x="1010" width="590" height="900"/></clipPath><filter id="card" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#102c42" flood-opacity=".2"/></filter><linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbfd"/><stop offset="1" stop-color="#dcefe9"/></linearGradient><linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#123b5d" stop-opacity="0"/><stop offset="1" stop-color="#123b5d" stop-opacity=".7"/></linearGradient></defs><rect width="1600" height="900" fill="url(#left)"/><rect x="1010" width="590" height="900" fill="#123b5d"/><g clip-path="url(#portrait)"><image href="/8.jpg" x="1010" width="590" height="900" preserveAspectRatio="xMidYMid slice"/><rect x="1010" width="590" height="900" fill="url(#overlay)"/></g><g font-family="Arial, Helvetica, sans-serif"><text x="105" y="104" font-size="25" font-weight="700" fill="#177245" letter-spacing="4">GABON • CONCOURS • AVENIR</text><text x="105" y="220" font-size="76" font-weight="800" fill="#123b5d">Votre avenir,</text><text x="105" y="302" font-size="76" font-weight="800" fill="#177245">mieux organisé.</text><text x="110" y="365" font-size="28" fill="#496579">Inscrivez-vous, déposez vos documents</text><text x="110" y="405" font-size="28" fill="#496579">et suivez chaque étape depuis un seul espace.</text><g transform="translate(108 480)" filter="url(#card)"><rect width="555" height="250" rx="22" fill="white"/><rect width="555" height="58" rx="22" fill="#123b5d"/><rect y="35" width="555" height="23" fill="#123b5d"/><circle cx="31" cy="29" r="8" fill="#f7d046"/><text x="53" y="36" font-size="20" font-weight="700" fill="white">GABConcours</text><text x="32" y="95" font-size="16" fill="#698091">ESPACE CANDIDAT</text><text x="32" y="131" font-size="27" font-weight="700" fill="#123b5d">Candidature BTS 2026</text><rect x="32" y="157" width="490" height="13" rx="7" fill="#e0ebef"/><rect x="32" y="157" width="365" height="13" rx="7" fill="#2aa876"/><circle cx="50" cy="205" r="15" fill="#2aa876"/><path d="M42 205l6 6 11-13" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="211" font-size="19" fill="#496579">Dossier complet • Validation en cours</text></g><g transform="translate(1050 700)"><text x="0" y="0" font-size="27" font-weight="700" fill="white">Une plateforme pour avancer.</text><text x="0" y="40" font-size="20" fill="#d8e8ee">Candidatures, documents et résultats.</text></g><g transform="translate(105 805)"><rect width="190" height="8" fill="#f7d046"/><rect x="205" width="190" height="8" fill="#2aa876"/><rect x="410" width="190" height="8" fill="#2d78bd"/></g></g></svg>