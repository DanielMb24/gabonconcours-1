name: CI Frontend - DevGroup Concours

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: "/home/devgroup-africa/projects/projets-internes/devgroup-concours/frontend"
  IMAGE_NAME: "devgroup-concours-frontend"
  HOST_PORT: "4040"

jobs:
  validate:
    name: Lint et Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup PNPM et Node
        uses: pnpm/setup@v2
        with:
          version: 11.18.0
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: 📊 Versions
        run: |
          node --version
          pnpm --version
          echo "📍 Chemin: ${{ env.PROJECT_PATH }}"

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm run lint

      - name: 🏗️ Build
        run: pnpm run build

      - name: 💾 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  container:
    name: Build et test Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐳 Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔨 Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: devgroup-concours-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Start container
        run: |
          docker run --detach --rm --name frontend-ci \
            --publish 4040:80 --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --security-opt no-new-privileges \
            devgroup-concours-frontend:ci

      - name: 🧪 Test
        run: |
          set -euo pipefail
          echo "🔄 Test frontend..."
          for attempt in {1..30}; do
            if curl -f http://127.0.0.1:4040/ > /dev/null 2>&1; then
              echo "✅ Frontend OK"
              exit 0
            fi
            sleep 2
          done
          docker logs frontend-ci
          exit 1

      - name: 📋 Logs
        if: failure()
        run: docker logs frontend-ci || true

      - name: 🛑 Stop
        if: always()
        run: docker stop frontend-ci || true

      - name: 📌 Info
        if: success()
        run: |
          echo "✨ Frontend compilé"
          echo "📁 Chemin: ${{ env.PROJECT_PATH }}"
          echo "🌐 Port: 4040"