services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_DRIVER: mongodb
      MONGODB_URI: mongodb://mongodb:27017/gabconcours
      MONGODB_DB_NAME: gabconcours
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      CORS_ORIGINS: http://localhost:8001,http://localhost:3000,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
